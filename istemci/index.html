<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yoga Koçu</title>
<!--
  Tarayici istemcisi (SCRUM-18 / T8, rapor IG-18, IG-19, AG-03).
  - Egitim videosunu sunucudan (GET /video) alip oynatir; oynat/duraklat ve sarma desteklenir.
  - Yarim saniyede bir videonun oynatma anini gonderir ve son durumu ister (GET /durum?t=34.5).
  - Gelen mesaji su an sadece basit bir seritte gosterir; asil gozluk arayuzu SCRUM-21'de yapilacak.
  Arka plan siyah: XREAL gozlukte siyah alan saydam gorunur, etraf gorulur.
-->
<style>
  :root { --serit: rgba(0, 0, 0, .65); --yazi: #fff; --soluk: #aaa; --iyi: #3c3; --kotu: #e44; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #000; color: var(--yazi);
               font-family: system-ui, sans-serif; overflow: hidden; }
  #sahne { position: relative; width: 100%; height: 100%; }
  video { width: 100%; height: 100%; object-fit: contain; background: #000; }

  /* Ust serit: koc mesaji ve sirasi (or. 1/3) */
  #mesajSerit { position: absolute; top: 0; left: 0; right: 0; padding: 10px 16px;
                background: var(--serit); font-size: 1.4rem; text-align: center; display: none; }
  #mesajSerit .sira { color: var(--soluk); font-size: 1rem; margin-left: 8px; }

  /* Baslat ekrani: tarayicilar sesli videoyu kullanici dokunmadan baslatmaz */
  #baslat { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
            background: #000; }
  #baslat button { font-size: 1.6rem; padding: 16px 40px; border-radius: 12px; border: 0;
                   background: #2a7; color: #fff; cursor: pointer; }

  /* Alt cubuk: oynat/duraklat ve baglanti bilgisi */
  #cubuk { position: absolute; left: 0; right: 0; bottom: 0; display: flex; gap: 12px;
           align-items: center; padding: 8px 12px; background: var(--serit); font-size: .9rem; }
  #cubuk button { font-size: 1rem; padding: 6px 14px; border-radius: 8px; border: 0; cursor: pointer; }
  #zamanCubugu { flex: 1; }
  .nokta { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--kotu);
           margin-right: 6px; vertical-align: middle; }
  .nokta.bagli { background: var(--iyi); }
  #bilgi { color: var(--soluk); white-space: nowrap; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<div id="sahne">
  <video id="video" src="/video" preload="auto" playsinline></video>

  <div id="mesajSerit"><span id="mesaj"></span><span class="sira" id="sira"></span></div>

  <div id="baslat"><button id="baslatDugme">Başlat</button></div>

  <div id="cubuk">
    <button id="oynatDugme">▶ Oynat</button>
    <input id="zamanCubugu" type="range" min="0" max="0" step="0.1" value="0" aria-label="Videoda konum">
    <span id="zaman">0:00 / 0:00</span>
    <span id="bilgi"><span class="nokta" id="baglantiNokta"></span><span id="baglanti">bağlanıyor…</span></span>
  </div>
</div>

<script>
const ARALIK_MS = 500;      // IG-19: oynatma ani yarim saniyede bir gonderilir
const ZAMAN_ASIMI_MS = 1500; // bu surede yanit gelmezse istek iptal edilir

const video = document.getElementById("video");
const oynatDugme = document.getElementById("oynatDugme");
const zamanCubugu = document.getElementById("zamanCubugu");

let istekSuruyor = false;   // onceki istek bitmeden yenisi gonderilmez (istekler ust uste binmez)
let surukleniyor = false;   // kullanici zaman cubugunu tutarken cubuk videoyla guncellenmez

function sureYaz(sn) {
  if (!isFinite(sn)) return "0:00";
  const d = Math.floor(sn / 60), s = Math.floor(sn % 60);
  return d + ":" + String(s).padStart(2, "0");
}

// --- Oynatma (IG-18) ---
document.getElementById("baslatDugme").addEventListener("click", async () => {
  document.getElementById("baslat").style.display = "none";
  try { await video.play(); } catch (e) { console.warn("Oynatma baslatilamadi:", e); }
});

oynatDugme.addEventListener("click", () => (video.paused ? video.play() : video.pause()));
video.addEventListener("play",  () => (oynatDugme.textContent = "⏸ Duraklat"));
video.addEventListener("pause", () => (oynatDugme.textContent = "▶ Oynat"));

video.addEventListener("loadedmetadata", () => { zamanCubugu.max = video.duration; });
video.addEventListener("timeupdate", () => {
  if (!surukleniyor) zamanCubugu.value = video.currentTime;
  document.getElementById("zaman").textContent = sureYaz(video.currentTime) + " / " + sureYaz(video.duration);
});
zamanCubugu.addEventListener("input",  () => { surukleniyor = true; });
zamanCubugu.addEventListener("change", () => { video.currentTime = Number(zamanCubugu.value); surukleniyor = false; });

// --- Oynatma anini gonderme ve durum alma (IG-19, AG-03) ---
function baglantiGoster(bagli, metin) {
  document.getElementById("baglantiNokta").classList.toggle("bagli", bagli);
  document.getElementById("baglanti").textContent = metin;
}

function durumGoster(d) {
  const serit = document.getElementById("mesajSerit");
  if (d.mesaj) {
    document.getElementById("mesaj").textContent = d.mesaj;
    document.getElementById("sira").textContent = d.toplam_hata > 0 ? d.sira + "/" + d.toplam_hata : "";
    serit.style.display = "block";
  } else {
    serit.style.display = "none";
  }
}

async function durumSor() {
  if (istekSuruyor) return;
  istekSuruyor = true;
  const t = video.currentTime.toFixed(2);
  const iptal = new AbortController();
  const zamanlayici = setTimeout(() => iptal.abort(), ZAMAN_ASIMI_MS);
  const baslangic = performance.now();
  try {
    const yanit = await fetch("/durum?t=" + t, { cache: "no-store", signal: iptal.signal });
    if (!yanit.ok) throw new Error("HTTP " + yanit.status);
    const d = await yanit.json();
    const gecikme = Math.round(performance.now() - baslangic);
    durumGoster(d);
    baglantiGoster(true, "t=" + t + " gönderildi · " + gecikme + " ms");
    window.sonDurum = d; // gelistirme icin: tarayici konsolundan bakilabilir
  } catch (e) {
    baglantiGoster(false, "bağlantı yok");
  } finally {
    clearTimeout(zamanlayici);
    istekSuruyor = false;
  }
}

setInterval(durumSor, ARALIK_MS);
durumSor();
</script>
</body>
</html>
